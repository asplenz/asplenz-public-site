<svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="ph-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#6366f1"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.07"/>
    </filter>
  </defs>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#374151" font-weight="700" letter-spacing="0.03em">SANS KNOWLEDGE</text>

  <rect x="130" y="44" width="260" height="44" rx="10" fill="white" filter="url(#sh)" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="130" y="44" width="5" height="44" rx="2.5" fill="#6366f1"/>
  <text x="260" y="71" text-anchor="middle" font-size="13" fill="#111827">L'agent reçoit une tâche</text>

  <line x1="260" y1="88" x2="260" y2="120" stroke="#6366f1" stroke-width="1.5" marker-end="url(#ph-arrow)"/>

  <rect x="130" y="120" width="260" height="44" rx="10" fill="white" filter="url(#sh)" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="130" y="120" width="5" height="44" rx="2.5" fill="#f59e0b"/>
  <text x="260" y="140" text-anchor="middle" font-size="12" fill="#111827" font-weight="500">L'agent agit</text>
  <text x="260" y="155" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">sans contexte sur vos règles</text>

  <line x1="260" y1="164" x2="260" y2="196" stroke="#6366f1" stroke-width="1.5" marker-end="url(#ph-arrow)"/>

  <rect x="130" y="196" width="260" height="44" rx="10" fill="white" filter="url(#sh)" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="130" y="196" width="5" height="44" rx="2.5" fill="#6366f1"/>
  <text x="260" y="223" text-anchor="middle" font-size="13" fill="#111827">L'humain review le résultat</text>

  <line x1="260" y1="240" x2="260" y2="272" stroke="#6366f1" stroke-width="1.5" marker-end="url(#ph-arrow)"/>

  <rect x="130" y="272" width="260" height="44" rx="10" fill="white" filter="url(#sh)" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="130" y="272" width="5" height="44" rx="2.5" fill="#f59e0b"/>
  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#111827" font-weight="500">L'humain détecte la violation</text>
  <text x="260" y="307" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">(peut-être)</text>

  <line x1="260" y1="316" x2="260" y2="348" stroke="#6366f1" stroke-width="1.5" marker-end="url(#ph-arrow)"/>

  <rect x="130" y="348" width="260" height="44" rx="10" fill="white" filter="url(#sh)" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="130" y="348" width="5" height="44" rx="2.5" fill="#f59e0b"/>
  <text x="260" y="368" text-anchor="middle" font-size="12" fill="#111827" font-weight="500">L'agent refait le travail</text>
  <text x="260" y="383" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">cycle perdu</text>
</svg>
